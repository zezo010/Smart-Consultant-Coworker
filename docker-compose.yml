version: '3.8'

services:
  # HexaGen GRC Engine
  hexagen-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hexagen-grc-engine
    ports:
      - "7010:7010"
    volumes:
      - ./templates:/app/templates:ro
      - ./frameworks:/app/frameworks:ro
      - ./data:/app/data
      - ./src:/app/src
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - CHROMA_PERSIST_DIR=/app/data/kb/vectordb
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - hexagen-network

  # Chroma Vector DB (Optional - can use local file-based)
  chroma:
    image: chromadb/chroma:latest
    container_name: hexagen-chroma
    ports:
      - "8000:8000"
    volumes:
      - ./data/kb/vectordb:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=False
    restart: unless-stopped
    networks:
      - hexagen-network

networks:
  hexagen-network:
    driver: bridge

volumes:
  chroma-data:
